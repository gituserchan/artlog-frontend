name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy frontend on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "===== Move to frontend repository ====="
            cd ~/artlog/artlog-frontend

            echo "===== Pull latest frontend code ====="
            git checkout main
            git pull origin main

            echo "===== Move to deploy directory ====="
            cd ~/artlog/artlog-deploy

            echo "===== Build frontend image ====="
            docker compose build frontend

            echo "===== Restart frontend container ====="
            docker compose up -d frontend

            echo "===== Wait for frontend startup ====="
            sleep 10

            echo "===== Check frontend ====="
            curl -f http://localhost:3000

            echo "===== Show container status ====="
            docker compose ps

            echo "===== Clean unused Docker images ====="
            docker image prune -f
